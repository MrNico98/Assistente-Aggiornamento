sonar.projectKey=LightYagami28_Assistente-Aggiornamento
sonar.organization=lightyagami28

# Nome e versione mostrati in SonarCloud.
sonar.projectName=Assistente-Aggiornamento
sonar.projectVersion=1.0

# Percorsi relativi a questo file.
sonar.sources=.
sonar.tests=scripts,tests
sonar.test.inclusions=scripts/*.Tests.ps1,tests/*.Tests.ps1
sonar.exclusions=checksums.md5,checksums.sha1,.github/**
sonar.sourceEncoding=UTF-8

# Copertura: report "Generic Test Coverage" prodotto da .github/scripts/Invoke-CoverageRun.ps1.
sonar.coverageReportPaths=coverage/sonar-coverage.xml
sonar.coverage.exclusions=tests/**,scripts/*.Tests.ps1,coverage/**
