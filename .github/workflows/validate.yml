name: Validate and Test ISO Catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Catalog (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Harden Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate catalog structure, policy, and cryptographic anchors (pwsh)
        shell: pwsh
        run: ./scripts/Validate-Links.ps1

      - name: Run security test suite (pwsh)
        shell: pwsh
        run: ./scripts/Validate-Links.Tests.ps1

      - name: Pester con copertura (pwsh)
        shell: pwsh
        run: |
          ./.github/scripts/Install-Pester.ps1
          ./.github/scripts/Invoke-CoverageRun.ps1

  validate-windows-ps5:
    name: Validate Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate catalog under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\Validate-Links.ps1

      - name: Run security test suite under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\Validate-Links.Tests.ps1

      - name: Pester con copertura sotto Windows PowerShell 5.1
        shell: powershell
        run: |
          ./.github/scripts/Install-Pester.ps1
          .\.github\scripts\Invoke-CoverageRun.ps1
